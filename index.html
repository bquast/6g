<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #info { position: fixed; left: 16px; top: 16px; max-width: 360px; padding: 14px 16px; border-radius: 14px;

<body>
<div id="info">
  <h1>sixg: walk through 6G</h1>
  A mini planet that shows how IMT-2030 (6G) works: radio on the ground, HAPS in the sky, LEO in space.<br>
  Desktop: click to look, <code>WASD</code> walk, <code>Shift</code> run, <code>E</code> board/exit craft.
  In the craft: <code>W/S</code> throttle, arrows pitch/roll, <code>A/D</code> yaw, <code>Q</code> assist, <code>L</code> labels, <code>G</code> world (6G / ElonVerse).<br>
  <button id="vr" disabled>Enter VR</button>
</div>
